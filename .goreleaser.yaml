version: 2
project_name: vctx

builds:
  - main: .
    binary: vctx
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc

homebrew_casks:
  - name: vctx
    repository:
      owner: eugene-panin
      name: homebrew-tap
    directory: Casks
    homepage: https://github.com/eugene-panin/vctx
    description: Switch the Vault CLI between several Vault instances
    license: MIT
    caveats: |
      Put your Vault instances in ~/.config/vctx/config.yaml (format: vctx help),
      then run once: vctx init
    # The binary is not notarized: without this macOS refuses to run it.
    # GoReleaser's hooks still write the postflight block Homebrew deprecated.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/vctx"]
        end
      end
